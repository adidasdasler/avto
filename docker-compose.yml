# Продакшен: PostgreSQL + сайт/API + MAX-бот (+ Telegram-бот по профилю) за Caddy с автоматическим HTTPS.
# Запуск на сервере: docker compose up -d --build   (подробно — deploy/README.md)
# Локальная разработка обходится без Docker: uvicorn ... и python -m shturman.bot.max

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-app: &app
  build: .
  image: shturman:latest
  env_file: .env
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shturman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: shturman
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shturman"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql+asyncpg://shturman:${POSTGRES_PASSWORD}@db:5432/shturman
      TRUST_PROXY_HEADERS: "true"  # API доступен только через Caddy
      BACKUP_DIR: /app/backups
    volumes:
      - ./backups:/app/backups  # те же файлы, что делает ночной deploy/backup.sh
    expose: ["8000"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  max-bot:
    <<: *app
    command: ["python", "-m", "shturman.bot.max"]
    environment:
      DATABASE_URL: postgresql+asyncpg://shturman:${POSTGRES_PASSWORD}@db:5432/shturman
    depends_on: {api: {condition: service_healthy}}  # таблицы создаёт api

  bot:
    <<: *app
    profiles: ["telegram"]  # запуск: docker compose --profile telegram up -d
    command: ["python", "-m", "shturman.bot"]
    environment:
      DATABASE_URL: postgresql+asyncpg://shturman:${POSTGRES_PASSWORD}@db:5432/shturman
    depends_on: {api: {condition: service_healthy}}

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-vincv.ru}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:

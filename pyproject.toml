[project]
name = "shturman"
version = "0.1.0"
description = "VinCv — проверка автомобиля по VIN: лендинг, API и Telegram-бот на данных avtovincod.ru"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "certifi",
    "pydantic-settings>=2.2",
    "jinja2>=3.1",
    "aiogram>=3.4",
    "weasyprint>=62",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shturman*"]

[tool.setuptools.package-data]
shturman = ["report/templates/*.html", "provider/samples/*.json", "web/templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
